<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--
  Content-Security-Policy: 送信先をブラウザレベルで制限する。

  【なぜ必要か】「体の進捗写真は端末外に出ない」という保証を、これまでは
  「js/photos.js と js/photoTab.js に fetch 等が書かれていないこと」で説明していた。
  しかしこの grep は js/homeTab.js に対しても0件を返す。にもかかわらず homeTab.js は
  import { analyzeInbody } from './ocr.js' 経由でGoogleに画像を送っている。
  つまりファイル単位の grep は送信経路の不在を証明しない。import を1行足せば
  grep は0件のまま送信可能になる。
  connect-src で許可先を列挙すれば、どのファイルがどう import しようと、
  ここに書かれていない宛先へは送れない。人間の約束ではなく機械的な強制になる。

  各ディレクティブの理由:
  - connect-src: 送信先は Gemini(食事写真・レシート・InBody結果紙のOCR)と
    Open Food Facts(JANコード照会)の2つだけ。'self' は data/*.json の取得用。
  - script-src 'self': js/charts.js が vendor/chart.umd.js を動的に <script> 注入する。
    同一オリジンなので 'self' で足りる。インラインスクリプトは0件なので許可しない。
  - style-src に 'unsafe-inline' が必要なのは style="..." 属性を91箇所で使っているため。
    これを外すには全てクラスへ移す必要がある(未実施・要求として起票済み)。
  - img-src の blob:/data: は IndexedDB から復元した体の写真とキャンバス出力の表示用。
  - media-src blob: はカメラプレビュー用。
  - object-src 'none' / base-uri 'self' / form-action 'none' は既定の締め。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com https://world.openfoodfacts.org; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<title>筋トレ管理</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- assets/sprite.svg のコピー。index.html にインラインしているのは <use href="#…">

     external <use> 未対応環境にも依存しない）。ソースの原本は assets/sprite.svg
     側にあり、シンボルを追加・変更したら両方に反映すること。 -->

  <symbol id="i-camera" viewBox="0 0 24 24">

  <symbol id="i-shuttle" viewBox="0 0 24 24">

  <symbol id="i-scale" viewBox="0 0 24 24">

  </symbol>

  <symbol id="i-clock" viewBox="0 0 24 24">

      d="M20 3.2a4 4 0 0 1 0 8 4 4 0 0 1 0-8ZM13.4 12.4h13.2l6.4 3.4 2.6 9.4-3.8 1.6-1.8-5.6v10.4l-1.6 10.6H29l-1.4 12.4h-5.2l-.8-12.4h-3.2l-.8 12.4h-5.2L11 41.8H9.2L7.6 31.2V20.8l-1.8 5.6L2 24.8l2.6-9.4Z"/>
  </symbol>

  <symbol id="torso-chest" viewBox="0 0 40 56">
    <path fill="currentColor" d="M14 15.6h5.2v7.8H14zM20.8 15.6H26v7.8h-5.2z"/>
  </symbol>
  <symbol id="torso-back" viewBox="0 0 40 56">
    <path fill="currentColor" d="M13.6 16.2 19.2 19v8.2l-5.6-3.4Zm12.8 0L20.8 19v8.2l5.6-3.4Z"/>
  </symbol>
  <symbol id="torso-shoulder" viewBox="0 0 40 56">

  </symbol>
  <symbol id="torso-arm" viewBox="0 0 40 56">
    <path fill="currentColor" d="M6.2 18.6 9.6 20l-1 9.4-3.6-1.2Zm27.6 0L30.4 20l1 9.4 3.6-1.2Z"/>
  </symbol>
  <symbol id="torso-abs" viewBox="0 0 40 56">
    <path fill="currentColor" d="M15.2 25.4h4v4h-4zm5.6 0h4v4h-4zm-5.6 5.2h4v4h-4zm5.6 0h4v4h-4zm-5.6 5.2h4v3.4h-4zm5.6 0h4v3.4h-4z"/>
  </symbol>
  <symbol id="torso-leg" viewBox="0 0 40 56">
    <path fill="currentColor" d="M12.8 41.4h5.4l.6 12.2h-4.6Zm8.8 0H27l-1.4 12.2h-4.6Z"/>
  </symbol>
</svg>

<header id="statusBar">
  <div class="bar"><span class="bar-label">タンパク質</span>
    <div class="track"><div class="fill" id="proteinFill"></div></div>
    <span class="bar-value" id="proteinValue">0 / 100g</span></div>
  <div class="bar"><span class="bar-label">カロリー</span>
    <div class="track"><div class="fill" id="kcalFill"></div></div>
    <span class="bar-value" id="kcalValue">0 / 1750</span></div>
  <!-- 進捗バーを持つのは死守2項目(タンパク質・カロリー)だけ。
       純アルコールは以前ここに3本目のバーを持っていたが、同じ太さのバーは
       「同じ格の管理項目」という意味になる。このアプリが守りたいのは
       タンパク質とカロリーの2つで、飲酒量はそれと同格ではない。
       脂質・炭水化物と同じ、進捗バー無しの小さな数値行へ降格する
       (js/mealTab.js の renderStatusBar / renderMacroSecondary 参照)。 -->
  <div class="macro-secondary" id="macroSecondary"></div>
  <div class="macro-secondary" id="alcoholSecondary"></div>
  <div id="warnings"></div>
</header>

<main>
  <section id="tab-home" class="tab"></section>
  <section id="tab-workout" class="tab hidden"></section>
  <section id="tab-meal" class="tab hidden"></section>
  <section id="tab-photo" class="tab hidden"></section>
  <section id="tab-record" class="tab hidden"></section>
  <section id="tab-settings" class="tab hidden"></section>
</main>

<nav id="tabbar">
  <button data-tab="home" class="active"><svg class="icon" aria-hidden="true"><use href="#i-plate"></use></svg><span>ホーム</span></button>
  <button data-tab="workout"><svg class="icon" aria-hidden="true"><use href="#i-barbell"></use></svg><span>トレ</span></button>
  <button data-tab="meal"><svg class="icon" aria-hidden="true"><use href="#i-bowl"></use></svg><span>食事</span></button>
  <button data-tab="photo"><svg class="icon" aria-hidden="true"><use href="#i-camera"></use></svg><span>写真</span></button>
  <button data-tab="record"><svg class="icon" aria-hidden="true"><use href="#i-chart"></use></svg><span>記録</span></button>
  <button data-tab="settings"><svg class="icon" aria-hidden="true"><use href="#i-gear"></use></svg><span>設定</span></button>
</nav>

<div id="toast" class="hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
